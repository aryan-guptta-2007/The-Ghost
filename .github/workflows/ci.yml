name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  functions:
    name: Backend API (lint + emulator tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # Same source of truth as Vercel: engines.node in backend/package.json.
      # npm test also runs with require(esm) disabled, the strictest loader,
      # so code that only works on lenient Node builds fails here, not in prod.
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/package.json
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: node --version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm install -g firebase-tools@15.34.0
      - run: npm run lint
      - run: npm test

  edge:
    name: Edge device (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==1.26.4 requests==2.31.0 pytest==8.3.3
      - run: python -m pytest -q edge_ai/tests
